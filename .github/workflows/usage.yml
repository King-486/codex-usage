name: codex-usage

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-usage
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 查询并记录真实状态
        id: quota
        run: python3 fetch_usage.py
        env:
          CODEX_TOKEN: ${{ secrets.CODEX_TOKEN }}
          CODEX_ACCOUNT_ID: ${{ secrets.CODEX_ACCOUNT_ID }}
      - name: 发布查询时间与失败状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish quota query status"
            git push
          fi
